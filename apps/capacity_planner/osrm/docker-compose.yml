# OSRM_DATA is the folder holding minnesota-latest.osrm* (made once with osrm-extract / osrm-partition /
# osrm-customize; the commands are in the header of apps/capacity_planner/scripts/build_drivetimes.R).
# The dashboard finds this service at http://host.docker.internal:5000 (same machine), http://localhost:5000
# or, when both run in one compose project, http://osrm:5000. Anywhere else set OSRM_URL for the dashboard.
services:
  osrm:
    image: osrm/osrm-backend
    container_name: osrm-mn
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - "${OSRM_DATA:-./data}:/data"
    command: osrm-routed --algorithm mld --max-table-size 2000 /data/minnesota-latest.osrm
